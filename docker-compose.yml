version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silent-sos-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/silentsos
      - JWT_SECRET=silent-sos-production-docker-jwt-secret-key!
      - REFRESH_SECRET=silent-sos-production-docker-refresh-secret-key!
      - ENCRYPTION_KEY=silent-sos-production-master-encryption-key-32b
      - ALLOWED_ORIGINS=http://localhost:5000,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:6.0
    container_name: silent-sos-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
    driver: local
