<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <title>Silent SOS | Emergency Response & Live Location Sharing</title>
    <meta name="description" content="Discreet emergency response platform for instant alert triggering and live location sharing with trusted contacts." />
    <!-- Leaflet CSS for OpenStreetMap rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      // Apply saved theme immediately to prevent flash
      (function() {
        var saved = localStorage.getItem('sos-theme-mode') || 'dark';
        var theme = saved;
        if (saved === 'auto') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
        document.documentElement.classList.remove(theme === 'dark' ? 'light' : 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-red-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
